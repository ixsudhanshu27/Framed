<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order a frame — Framed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
  .preview { width: 100%; aspect-ratio: 4/5; border-radius: 14px; background: var(--surface);
    border: 1px dashed var(--border2); display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--muted); font-size: 14px; }
  .preview img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="/">Framed<span>.</span></a>
    <div class="navlinks">
      <a href="/order.html">Order a frame</a>
      <a href="/dashboard.html">Track my order</a>
      <a href="/admin.html">Admin</a>
    </div>
  </div>
</nav>

<div class="page wrap">
  <div class="page-head">
    <div class="kicker">New order</div>
    <h2>Send us a photo.</h2>
  </div>

  <div class="grid">
    <div>
      <div class="preview" id="preview">No photo selected yet</div>
    </div>

    <form id="order-form" class="card">
      <label for="photo">Your photo</label>
      <input type="file" id="photo" accept="image/*" required>

      <label for="name">Your name</label>
      <input type="text" id="name" required>

      <label for="email">Email (used to track your order)</label>
      <input type="email" id="email" required>

      <label for="frameStyle">Frame style</label>
      <select id="frameStyle">
        <option value="classic-wood">Classic wood</option>
        <option value="black-metal">Black metal</option>
        <option value="brushed-brass">Brushed brass</option>
        <option value="minimal-acrylic">Minimal acrylic</option>
      </select>

      <label for="frameSize">Size</label>
      <select id="frameSize">
        <option value="5x7">5 × 7 in</option>
        <option value="8x10" selected>8 × 10 in</option>
        <option value="11x14">11 × 14 in</option>
        <option value="16x20">16 × 20 in</option>
      </select>

      <label for="notes">Anything we should know? (optional)</label>
      <textarea id="notes" placeholder="e.g. please colorize this one, it's black and white"></textarea>

      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;justify-content:center;margin-top:24px">
        Submit order
      </button>
      <div id="form-msg"></div>
    </form>
  </div>
</div>

<script src="/js/order.js"></script>
</body>
</html>
