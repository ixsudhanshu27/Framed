<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Framed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  #login-card { max-width: 380px; margin: 100px auto; }
  .admin-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .admin-top .page-head { margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .stat strong { display: block; font-family: 'Clash Display', sans-serif; font-size: 1.8rem; color: var(--lime); line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 220px; }
  .toolbar select { width: auto; min-width: 160px; }
  tr.row:hover { background: var(--surface); cursor: pointer; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 50;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg1); border: 1px solid var(--border2); border-radius: 16px; width: 100%; max-width: 860px; padding: 28px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  @media (max-width: 720px) { .modal-grid { grid-template-columns: 1fr; } }
  .modal img.big { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 14px; margin-bottom: 8px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn-danger { background: rgba(255,138,122,0.1); border-color: rgba(255,138,122,0.3); color: var(--err); }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="/">Framed<span>.</span></a>
    <div class="navlinks">
      <a href="/order.html">Order a frame</a>
      <a href="/dashboard.html">Track my order</a>
      <a href="/admin.html">Admin</a>
    </div>
  </div>
</nav>

<div id="login-view" class="page wrap">
  <div class="card" id="login-card">
    <div class="kicker">Admin</div>
    <h2 style="margin-bottom: 18px;">Sign in</h2>
    <label for="password">Password</label>
    <input type="password" id="password">
    <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;margin-top:20px">Sign in</button>
    <div id="login-msg"></div>
  </div>
</div>

<div id="admin-view" class="page wrap" style="display:none">
  <div class="admin-top">
    <div class="page-head">
      <div class="kicker">Admin</div>
      <h2>Orders</h2>
    </div>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search by name, email or order ID">
    <select id="status-filter"></select>
    <button class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
  </div>

  <div class="card" style="overflow-x:auto; padding: 8px 16px;">
    <table>
      <thead>
        <tr><th>Photo</th><th>Order</th><th>Customer</th><th>Frame</th><th>Placed</th><th>Status</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script src="/js/admin.js"></script>
</body>
</html>
