<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track my order — Framed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .lookup { display: flex; gap: 12px; max-width: 480px; }
  .lookup input { flex: 1; }
  .order-card { display: grid; grid-template-columns: 64px 1fr auto; gap: 18px; align-items: center;
    padding: 18px; margin-bottom: 14px; }
  .order-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
  .order-meta p { font-size: 13.5px; }
  .order-meta h3 { font-size: 16px; margin-bottom: 4px; }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="logo" href="/">Framed<span>.</span></a>
    <div class="navlinks">
      <a href="/order.html">Order a frame</a>
      <a href="/dashboard.html">Track my order</a>
      <a href="/admin.html">Admin</a>
    </div>
  </div>
</nav>

<div class="page wrap">
  <div class="page-head">
    <div class="kicker">Your orders</div>
    <h2>Track a photo you've sent us.</h2>
  </div>

  <div class="card" style="margin-bottom: 30px;">
    <label for="email">Email used on your order</label>
    <div class="lookup">
      <input type="email" id="email" placeholder="you@example.com">
      <button class="btn btn-primary" id="lookup-btn">Find orders</button>
    </div>
  </div>

  <div id="results"></div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
